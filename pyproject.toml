[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-voucher-service"
version = "0.1.0"
description = "Operator voucher service: turns agent requests into registry enrollment vouchers, within operator policy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.19",
    "cryptography>=42",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
voucherctl = "voucher_service.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voucher_service*"]
